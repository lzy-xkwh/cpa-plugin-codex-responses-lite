name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build and package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify, test, and vet
        run: |
          go mod verify
          go test ./... -count=1
          go vet ./...
          python3 scripts/check-registry.py registry.json
      - name: Build and package
        env:
          TAG: ${{ github.ref_name }}
          PLUGIN_ID: aq-codex-responses-lite
        run: |
          version="${TAG#v}"
          mkdir -p dist/package
          CGO_ENABLED=1 go build -buildmode=c-shared -trimpath -o dist/package/${PLUGIN_ID}.so .
          (cd dist/package && zip -j "../${PLUGIN_ID}_${version}_linux_${{ matrix.arch }}.zip" ${PLUGIN_ID}.so)
          arch_out="$(file dist/package/${PLUGIN_ID}.so)"
          echo "$arch_out"
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            echo "$arch_out" | grep -q "x86-64"
          else
            echo "$arch_out" | grep -q "aarch64"
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aq-codex-responses-lite-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.zip > checksums.txt
          cat checksums.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip dist/checksums.txt --generate-notes --verify-tag

  registry:
    name: Update plugin store manifest
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download packaged release assets
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Point registry.json at this release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          scripts/update-registry.sh "$version" --artifacts-dir dist
      - name: Commit and push registry.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if git diff --quiet -- registry.json; then
            echo "registry.json already points at v${version}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json
          git commit -m "chore: point plugin store registry at v${version}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
